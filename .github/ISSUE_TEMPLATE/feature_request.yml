name: 功能建议
description: 提出新功能或改进现有交互
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        闪记的目标是「不打断当前工作流的速记小窗」：纯本地、轻量、召之即来。请先说明提案如何服务于这一点，以及它会不会让主流程变重。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情境下遇到不便？现在是怎么绕过的？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围（大致判断即可）
      options:
        - label: 需要新的设置项
        - label: 需要改动笔记文件格式
        - label: 需要联网 / 云同步（与「纯本地」定位冲突，请重点说明理由）
