name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: 前端构建 + Rust 检查
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      # tauri::generate_context! 在编译期要求 frontendDist 目录存在，必须先构建前端
      - name: 构建前端（类型检查 + Vite）
        run: npm run build

      - name: 检查格式
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试
        working-directory: src-tauri
        run: cargo test
