<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>闪记</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="card">
      <header data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <span class="dot"></span>
          <span>闪记</span>
        </div>
        <div class="actions">
          <button id="notes-btn" class="icon-btn" title="查看笔记" aria-label="查看笔记">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 7v14" />
              <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
            </svg>
          </button>
          <button id="pin" class="icon-btn" title="常驻模式：保存后保持打开" aria-label="常驻模式">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 17v5" />
              <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z" />
            </svg>
          </button>
          <button id="settings-btn" class="icon-btn" title="设置" aria-label="设置">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <button id="close-btn" class="icon-btn" title="收起 (Esc)" aria-label="收起">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
      </header>

      <main>
        <textarea
          id="note"
          aria-label="速记内容"
          placeholder="想到什么就写什么…"
          spellcheck="false"
          autofocus
        ></textarea>
      </main>

      <footer>
        <span id="source" class="source"></span>
        <span class="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 保存 · <kbd>Esc</kbd> 收起</span>
      </footer>

      <div id="toast" class="toast" role="status" aria-live="polite">
        <span id="toast-message"></span>
      </div>

      <!-- 撤销条和普通提示分开，避免「已更新」之类的提示把撤销入口挤掉 -->
      <div id="undo-bar" class="toast undo-bar" role="status" aria-live="polite">
        <span id="undo-message"></span>
        <button id="undo-action" class="toast-action" type="button">撤销</button>
      </div>

      <div id="update-banner" class="update-banner hidden" role="status" aria-live="polite">
        <span id="update-banner-text" class="update-banner-text"></span>
        <button id="update-banner-action" class="btn tiny" type="button">更新</button>
        <button id="update-banner-dismiss" class="icon-btn" type="button" aria-label="稍后再说">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
      <div id="resize-grip" title="拖动调整大小"></div>

      <section
        id="settings"
        class="settings hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
      >
        <div class="settings-head" data-tauri-drag-region="deep">
          <span id="settings-title" data-tauri-drag-region>设置</span>
          <button id="settings-close" class="icon-btn" aria-label="关闭设置">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>

        <div class="settings-body">
          <div class="field">
            <label for="hotkey-input">唤起快捷键</label>
            <div class="row">
              <input id="hotkey-input" readonly />
              <button id="hotkey-record" class="btn">录制</button>
            </div>
            <p id="hotkey-error" class="error"></p>
          </div>

          <div class="field">
            <label for="notes-dir">笔记目录</label>
            <div class="row">
              <input id="notes-dir" readonly />
              <button id="choose-dir" class="btn">选择</button>
            </div>
          </div>

          <label class="check">
            <input id="capture-source" type="checkbox" />
            自动记录来源窗口
          </label>

          <label class="check" title="每条写成 ### 时间 + 原文，代码块、表格、标题可正常渲染">
            <input id="markdown-mode" type="checkbox" />
            Markdown 模式
          </label>

          <label class="check">
            <input id="autostart" type="checkbox" />
            开机自启
          </label>

          <label class="check">
            <input id="auto-update" type="checkbox" />
            自动检查更新
          </label>

          <label class="check" title="窗口失去焦点时自动收起；常驻模式下不生效">
            <input id="auto-hide" type="checkbox" />
            失去焦点时自动收起
          </label>

          <div class="field">
            <label for="theme">主题</label>
            <select id="theme" class="select">
              <option value="system">跟随系统</option>
              <option value="light">浅色</option>
              <option value="dark">深色</option>
            </select>
          </div>

          <div class="field">
            <label for="bg-opacity">背景不透明度 <span id="bg-opacity-value">100%</span></label>
            <input id="bg-opacity" type="range" min="60" max="100" step="1" />
          </div>

          <div class="field sync-section">
            <span class="section-title">云同步（WebDAV）</span>
            <label class="check" title="默认关闭；不启用时不会发起任何网络请求">
              <input id="sync-enabled" type="checkbox" />
              启用云同步
            </label>
            <label for="sync-url">WebDAV 地址</label>
            <input
              id="sync-url"
              class="text-input"
              type="url"
              placeholder="https://dav.example.com/dav/"
              spellcheck="false"
            />
            <label for="sync-username">用户名</label>
            <input
              id="sync-username"
              class="text-input"
              type="text"
              autocomplete="off"
              spellcheck="false"
            />
            <label for="sync-password">密码 / 应用密码</label>
            <input
              id="sync-password"
              class="text-input"
              type="password"
              placeholder="留空则保留已保存的密码（改地址或用户名后需重新输入）"
              autocomplete="off"
            />
            <div class="row">
              <select id="sync-interval" class="select" aria-label="自动同步间隔">
                <option value="5">每 5 分钟</option>
                <option value="15">每 15 分钟</option>
                <option value="60">每 60 分钟</option>
              </select>
              <input
                id="sync-device"
                class="text-input"
                type="text"
                placeholder="设备名（可选）"
                spellcheck="false"
              />
            </div>
            <label class="check" title="http:// 会明文传输账号密码，仅限可信内网">
              <input id="sync-allow-http" type="checkbox" />
              允许明文 http://
            </label>
            <div class="row">
              <button id="sync-save" class="btn primary" type="button">保存</button>
              <button id="sync-test" class="btn" type="button">测试连接</button>
              <button id="sync-now" class="btn" type="button">立即同步</button>
            </div>
            <p id="sync-status-text" class="sync-status" aria-live="polite"></p>
            <p id="sync-error" class="error"></p>
          </div>

          <div class="field">
            <div class="row">
              <span class="tip">当前版本 <span id="app-version">—</span></span>
              <button id="check-update" class="btn" type="button">检查更新</button>
            </div>
            <p id="update-status" class="tip" aria-live="polite"></p>
          </div>

          <p class="tip">笔记按日期保存为本地 Markdown 文件。</p>
        </div>
      </section>

      <section
        id="history"
        class="history hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="history-title"
      >
        <div class="settings-head" data-tauri-drag-region="deep">
          <span id="history-title" data-tauri-drag-region>笔记</span>
          <div class="history-tools">
            <button
              id="history-preview"
              class="btn tiny"
              type="button"
              aria-pressed="false"
              title="切换 Markdown 渲染预览"
            >
              预览
            </button>
            <button id="history-close" class="icon-btn" aria-label="关闭笔记">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
          </div>
        </div>

        <input
          id="history-search"
          class="search-input"
          type="search"
          aria-label="搜索笔记"
          aria-controls="entry-list"
          placeholder="搜索笔记…"
          spellcheck="false"
        />

        <div id="entry-list" class="entry-list"></div>

        <div class="history-foot">
          <span id="history-count" aria-live="polite"></span>
          <span id="sync-foot-status" class="sync-foot-status"></span>
          <button
            id="sync-conflicts"
            class="btn tiny"
            type="button"
            title="打开笔记文件夹查看冲突副本"
            hidden
          ></button>
          <button id="history-folder" class="btn">打开文件夹</button>
        </div>
      </section>

      <section
        id="welcome"
        class="welcome hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="welcome-title"
      >
        <div class="settings-head" data-tauri-drag-region="deep">
          <span id="welcome-title" data-tauri-drag-region>欢迎使用闪记</span>
        </div>
        <div class="welcome-body">
          <p class="welcome-lead">按一下快捷键，就能在任何窗口上方随手记一笔。</p>
          <ul class="welcome-list">
            <li><span class="welcome-key" id="welcome-hotkey">Ctrl + Alt + N</span> 唤起 / 收起</li>
            <li>笔记保存在 <code id="welcome-dir"></code></li>
            <li>点图钉可切换「保存后不收起」</li>
          </ul>
        </div>
        <div class="welcome-actions">
          <button id="welcome-settings" class="btn">调整快捷键</button>
          <button id="welcome-start" class="btn primary">开始使用</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
