[package]
name = "flashnote"
version = "0.5.1"
description = "不打断阅读的速记小窗"
authors = ["ranger"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
tauri-plugin-log = "2"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "system-proxy", "charset"] }
quick-xml = "0.42"
percent-encoding = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# 密码只进 Windows 凭据管理器，设置文件里不存明文。
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
